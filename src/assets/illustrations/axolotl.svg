<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="600" height="600" role="img" aria-label="Ajolote verde animado" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ajolote animado</title>
  <style>
    /* ===== Paleta ===== */
    :root { --body:#07a872; --outline:#067a55; --gill:#86d35f; --red:#ff4d57; --orange:#ff8f2e; --ink:#2f3b3b; --coral:#ff5f5f; --yellow:#ffcc2e; }

    /* ===== Ciclo total ===== */
    .anim { animation-duration: 8.9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; transform-origin: 600px 640px; }

    /* ===== Vista frontal / lateral ===== */
    #front { animation-name: frontView; }
    #side  { animation-name: sideView; opacity: 0; }
    @keyframes frontView {
      0%, 34%  { opacity:1; transform:scaleX(1); }
      40%      { opacity:0; transform:scaleX(.55); }
      89%      { opacity:0; transform:scaleX(.55); }
      95%,100% { opacity:1; transform:scaleX(1); }
    }
    @keyframes sideView {
      0%, 34%  { opacity:0; transform:scaleX(.55); }
      40%      { opacity:1; transform:scaleX(1); }
      89%      { opacity:1; transform:scaleX(1); }
      95%,100% { opacity:0; transform:scaleX(.55); }
    }

    /* ===== FRONTAL: cuerpo (se aplasta al subir las manos) ===== */
    #front-body { animation-name: squash; transform-origin: 600px 855px; }
    @keyframes squash {
      0%, 9%   { transform:scaleY(1); }
      14%, 29% { transform:scaleY(.93); }
      34%,100% { transform:scaleY(1); }
    }

    /* ===== FRONTAL: branquias (aleteo suave) ===== */
    .gill-l, .gill-r { animation-name: wiggle; }
    .gill-l.g1 { transform-origin: 360px 540px; } .gill-r.g1 { transform-origin: 840px 540px; }
    .gill-l.g2 { transform-origin: 340px 610px; } .gill-r.g2 { transform-origin: 860px 610px; }
    .gill-l.g3 { transform-origin: 340px 720px; } .gill-r.g3 { transform-origin: 860px 720px; }
    .gill-r { animation-direction: reverse; }
    @keyframes wiggle {
      0%, 100% { transform:rotate(0); }
      4%  { transform:rotate(-5deg); }
      8%  { transform:rotate(3deg); }
      12% { transform:rotate(-4deg); }
      16% { transform:rotate(0); }
      24% { transform:rotate(-7deg); }
      30%, 60% { transform:rotate(-7deg); }
      68% { transform:rotate(0); }
    }

    /* ===== FRONTAL: manos suben al pecho ===== */
    #hand-l { animation-name: handL; } #hand-r { animation-name: handR; }
    @keyframes handL { 0%,100%{transform:translate(0,0)} }
    @keyframes handR { 0%,9%{transform:translate(0,0)} 14%,29%{transform:translate(-105px,-100px)} 34%,100%{transform:translate(0,0)} }

    /* ===== FRONTAL: signo de interrogación ===== */
    #qfront { animation-name: qfront; transform-origin: 880px 400px; opacity: 0; }
    @keyframes qfront {
      0%, 17%  { opacity:0; transform:scale(0) rotate(-12deg); }
      21%      { opacity:1; transform:scale(1.18) rotate(6deg); }
      24%, 29% { opacity:1; transform:scale(1) rotate(0); }
      26.5%    { transform:scale(1) rotate(-4deg); }
      33%,100% { opacity:0; transform:scale(0) rotate(0); }
    }


    /* ===== LATERAL: parpadeo ===== */
    #eye-s { animation-name: blink; transform-origin: 790px 615px; }
    @keyframes blink {
      0%, 41%, 45%, 76%, 80%, 100% { transform:scaleY(1); }
      43%, 78% { transform:scaleY(.1); }
    }

    /* ===== LATERAL: branquias se pliegan en columna ===== */
    #gills-side { animation-name: fold; transform-origin: 560px 640px; }
    @keyframes fold {
      0%, 40%  { transform:scaleX(.5) scaleY(1); }
      46%      { transform:scaleX(1.1); }
      52%, 76% { transform:scaleX(1); }
      82%      { transform:scaleX(1.3); }
      89%,100% { transform:scaleX(.5); }
    }
    #gills-side .inner { animation-name: innerShow; }
    @keyframes innerShow {
      0%, 46%  { opacity:0; }
      52%, 76% { opacity:1; }
      82%,100% { opacity:0; }
    }

    /* ===== LATERAL: signo de interrogación ===== */
    #qmark { animation-name: qmark; transform-origin: 950px 400px; opacity: 0; }
    @keyframes qmark {
      0%, 54%   { opacity:0; transform:scale(0) rotate(-15deg); }
      58%       { opacity:1; transform:scale(1.15) rotate(5deg); }
      61%, 69%  { opacity:1; transform:scale(1) rotate(0); }
      73%,100%  { opacity:0; transform:scale(0); }
    }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } #side { opacity:0 !important; } #front { opacity:1 !important; } }
  </style>

  <defs>
    <!-- Branquia reutilizable: exterior verde claro + interior de color -->
    <g id="gill-top"><ellipse cx="0" cy="0" rx="75" ry="112" fill="#86d35f"/><ellipse cx="14" cy="28" rx="45" ry="75" fill="#ff4d57"/></g>
    <g id="gill-mid"><ellipse cx="0" cy="0" rx="122" ry="68" fill="#86d35f"/><ellipse cx="22" cy="6" rx="76" ry="40" fill="#ff4d57"/></g>
    <g id="gill-bot"><ellipse cx="0" cy="0" rx="122" ry="68" fill="#86d35f"/><ellipse cx="18" cy="-6" rx="58" ry="42" fill="#ff8f2e"/></g>
    <!-- Signo de interrogación + chispas (reutilizable) -->
    <g id="qmark-art">
      <path d="M838 268C838 222 880 205 918 214C962 225 972 282 930 308C900 326 880 338 878 372" fill="none" stroke="#ff5f5f" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="878" cy="436" r="30" fill="#ff5f5f"/>
      <path d="M458 420l30 30M541 375l8 50" fill="none" stroke="#ffcc2e" stroke-width="22" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ================= VISTA FRONTAL ================= -->
  <g id="front" class="anim">
    <g id="front-body" class="anim">
      <!-- Branquias izquierda -->
      <g class="anim gill-l g1"><use href="#gill-top" transform="translate(297 455) rotate(-25)"/></g>
      <g class="anim gill-l g2"><use href="#gill-mid" transform="translate(228 603) rotate(-6)"/></g>
      <g class="anim gill-l g3"><use href="#gill-bot" transform="translate(232 745) rotate(10)"/></g>
      <!-- Branquias derecha (espejo) -->
      <g class="anim gill-r g1"><use href="#gill-top" transform="translate(903 455) scale(-1 1) rotate(-25)"/></g>
      <g class="anim gill-r g2"><use href="#gill-mid" transform="translate(972 603) scale(-1 1) rotate(-6)"/></g>
      <g class="anim gill-r g3"><use href="#gill-bot" transform="translate(968 745) scale(-1 1) rotate(10)"/></g>

      <!-- Cuerpo -->
      <ellipse cx="600" cy="637" rx="272" ry="218" fill="#07a872"/>
      <!-- Ojos -->
      <circle cx="433" cy="627" r="29" fill="#fff"/>
      <circle cx="772" cy="625" r="29" fill="#fff"/>
      <!-- Boca -->
      <path d="M503 684 Q527 712 552 694 T602 694 T652 694 T702 684" fill="none" stroke="#2f3b3b" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Manos -->
    <g id="hand-l" class="anim"><circle cx="437" cy="822" r="55" fill="#07a872"/><path d="M382 822a55 55 0 0 1 110 0" fill="none" stroke="#067a55" stroke-width="8" stroke-linecap="round"/></g>
    <g id="hand-r" class="anim"><circle cx="768" cy="822" r="55" fill="#07a872"/><path d="M713 822a55 55 0 0 1 110 0" fill="none" stroke="#067a55" stroke-width="8" stroke-linecap="round"/></g>

    <!-- Signo de interrogación -->
    <g id="qfront" class="anim"><use href="#qmark-art"/></g>
  </g>

  <!-- ================= VISTA LATERAL ================= -->
  <g id="side" class="anim">
    <!-- Cola -->
    <path d="M380 690 Q270 690 215 735 Q290 775 420 770 Z" fill="#07a872"/>
    <!-- Cuerpo -->
    <ellipse cx="620" cy="640" rx="290" ry="205" fill="#07a872"/>
    <!-- Patas -->
    <ellipse cx="500" cy="842" rx="40" ry="28" fill="#07a872" stroke="#067a55" stroke-width="6"/>
    <ellipse cx="600" cy="848" rx="40" ry="28" fill="#07a872" stroke="#067a55" stroke-width="6"/>
    <ellipse cx="710" cy="848" rx="40" ry="28" fill="#07a872" stroke="#067a55" stroke-width="6"/>
    <ellipse cx="800" cy="835" rx="40" ry="28" fill="#07a872" stroke="#067a55" stroke-width="6"/>

    <!-- Branquias plegadas en columna -->
    <g id="gills-side" class="anim">
      <ellipse cx="565" cy="520" rx="38" ry="75" fill="#86d35f" transform="rotate(6 565 520)"/>
      <ellipse cx="552" cy="645" rx="32" ry="55" fill="#86d35f"/>
      <ellipse cx="556" cy="755" rx="40" ry="75" fill="#86d35f" transform="rotate(-5 556 755)"/>
      <g class="inner anim">
        <ellipse cx="570" cy="525" rx="14" ry="45" fill="#ff4d57"/>
        <ellipse cx="552" cy="645" rx="12" ry="28" fill="#ff8f2e"/>
        <ellipse cx="558" cy="758" rx="14" ry="45" fill="#ff8f2e"/>
      </g>
    </g>

    <!-- Ojo y boca -->
    <circle id="eye-s" class="anim" cx="790" cy="615" r="26" fill="#fff"/>
    <path d="M880 685q14 12 28-2" fill="none" stroke="#2f3b3b" stroke-width="8" stroke-linecap="round"/>

    <!-- Signo de interrogación -->
    <g id="qmark" class="anim"><use href="#qmark-art" transform="translate(70 -10)"/></g>
  </g>
</svg>
