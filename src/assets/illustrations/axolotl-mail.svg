<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="600" height="600" role="img" aria-label="Ajolote enviando un correo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ajolote enviando un correo</title>
  <style>
    /* ===== Ciclo total (envío y regreso del sobre) ===== */
    .anim { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

    /* ===== Cuerpo: respira y se agacha un poco al lanzar ===== */
    #body { animation-name: body; transform-origin: 600px 855px; }
    @keyframes body {
      0%, 100% { transform: scaleY(1); }
      6%       { transform: scaleY(1.02); }
      12%      { transform: scaleY(1); }
      17%      { transform: scaleY(.95); }
      23%      { transform: scaleY(1.03); }
      30%, 88% { transform: scaleY(1); }
      94%      { transform: scaleY(1.02); }
    }

    /* ===== Branquias ===== */
    .gl, .gr { animation-name: wiggle; }
    .gl.g1 { transform-origin: 360px 540px; } .gr.g1 { transform-origin: 840px 540px; }
    .gl.g2 { transform-origin: 340px 610px; } .gr.g2 { transform-origin: 860px 610px; }
    .gl.g3 { transform-origin: 340px 720px; } .gr.g3 { transform-origin: 860px 720px; }
    .gr { animation-direction: reverse; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      8%  { transform: rotate(-4deg); }
      16% { transform: rotate(3deg); }
      24% { transform: rotate(-9deg); }  /* impulso al enviar */
      34% { transform: rotate(2deg); }
      50% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }

    /* ===== Cara: contento al enviar ===== */
    #eyes   { animation-name: eyes; }
    #happy  { animation-name: happy; opacity: 0; }
    #mouth  { animation-name: mouth; }
    #smile  { animation-name: smile; opacity: 0; }
    @keyframes eyes  { 0%,19% { opacity:1 } 21%,55% { opacity:0 } 57%,100% { opacity:1 } }
    @keyframes happy { 0%,19% { opacity:0 } 21%,55% { opacity:1 } 57%,100% { opacity:0 } }
    @keyframes mouth { 0%,19% { opacity:1 } 21%,55% { opacity:0 } 57%,100% { opacity:1 } }
    @keyframes smile { 0%,19% { opacity:0 } 21%,55% { opacity:1 } 57%,100% { opacity:0 } }
    #blink { animation-name: blink; transform-origin: 600px 627px; }
    @keyframes blink { 0%,60%,64%,100% { transform: scaleY(1) } 62% { transform: scaleY(.1) } }

    /* ===== Manos: sostienen, lanzan y reciben ===== */
    #hl { animation-name: hl; } #hr { animation-name: hr; }
    @keyframes hl {
      0%, 12%  { transform: translate(0,0); }
      17%      { transform: translate(-6px,-26px); }
      22%      { transform: translate(34px,-92px); }   /* empuja */
      30%      { transform: translate(10px,-40px); }
      40%, 62% { transform: translate(0,6px); }
      72%      { transform: translate(0,-6px); }
      80%,100% { transform: translate(0,0); }
    }
    @keyframes hr {
      0%, 12%  { transform: translate(0,0); }
      17%      { transform: translate(6px,-26px); }
      22%      { transform: translate(-34px,-92px); }
      30%      { transform: translate(-10px,-40px); }
      40%, 62% { transform: translate(0,6px); }
      72%      { transform: translate(0,-6px); }
      80%,100% { transform: translate(0,0); }
    }

    /* ===== Sobre: vuela hacia arriba a la derecha, se desvanece y reaparece ===== */
    #env { animation-name: env; transform-origin: 600px 800px; }
    @keyframes env {
      0%, 12%  { transform: translate(0,0) scale(1) rotate(0); opacity: 1; }
      17%      { transform: translate(0,-26px) scale(1.05) rotate(-6deg); opacity: 1; }
      22%      { transform: translate(40px,-90px) scale(1.08) rotate(4deg); opacity: 1; }
      40%      { transform: translate(330px,-400px) scale(.55) rotate(18deg); opacity: .9; }
      48%      { transform: translate(400px,-480px) scale(.38) rotate(22deg); opacity: 0; }
      64%      { transform: translate(400px,-480px) scale(.38) rotate(22deg); opacity: 0; }
      64.1%    { transform: translate(0,10px) scale(.3) rotate(0); opacity: 0; }
      74%      { transform: translate(0,-8px) scale(1.12) rotate(0); opacity: 1; }
      82%,100% { transform: translate(0,0) scale(1) rotate(0); opacity: 1; }
    }

    /* ===== Líneas de movimiento ===== */
    .mv { animation-name: mv; opacity: 0; }
    .mv.b { animation-delay: .05s; } .mv.c { animation-delay: .1s; }
    @keyframes mv {
      0%, 20%  { opacity: 0; transform: translate(0,0); }
      25%      { opacity: .9; }
      36%      { opacity: 0; transform: translate(-40px,60px); }
      100%     { opacity: 0; }
    }

    /* ===== Corazones y estrellas ===== */
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation-name: pop; }
    .pop.h2 { animation-delay: .25s; } .pop.h3 { animation-delay: .5s; } .pop.s1 { animation-delay: .15s; } .pop.s2 { animation-delay: .4s; }
    @keyframes pop {
      0%, 24%  { opacity: 0; transform: translateY(20px) scale(0); }
      30%      { opacity: 1; transform: translateY(0) scale(1.2); }
      34%      { transform: translateY(-6px) scale(1); }
      46%      { opacity: 0; transform: translateY(-50px) scale(.8); }
      100%     { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .pop, .mv { display: none; } }
  </style>

  <defs>
    <g id="gill-top"><ellipse rx="75" ry="112" fill="#86d35f"/><ellipse cx="14" cy="28" rx="45" ry="75" fill="#ff4d57"/></g>
    <g id="gill-mid"><ellipse rx="122" ry="68" fill="#86d35f"/><ellipse cx="22" cy="6" rx="76" ry="40" fill="#ff4d57"/></g>
    <g id="gill-bot"><ellipse rx="122" ry="68" fill="#86d35f"/><ellipse cx="18" cy="-6" rx="58" ry="42" fill="#ff8f2e"/></g>
    <path id="heart" d="M0 12 C-26 -8 -18 -28 0 -14 C18 -28 26 -8 0 12Z"/>
    <path id="star" d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16Z"/>
  </defs>

  <!-- Ajolote -->
  <g id="body" class="anim">
    <g class="anim gl g1"><use href="#gill-top" transform="translate(297 455) rotate(-25)"/></g>
    <g class="anim gl g2"><use href="#gill-mid" transform="translate(228 603) rotate(-6)"/></g>
    <g class="anim gl g3"><use href="#gill-bot" transform="translate(232 745) rotate(10)"/></g>
    <g class="anim gr g1"><use href="#gill-top" transform="translate(903 455) scale(-1 1) rotate(-25)"/></g>
    <g class="anim gr g2"><use href="#gill-mid" transform="translate(972 603) scale(-1 1) rotate(-6)"/></g>
    <g class="anim gr g3"><use href="#gill-bot" transform="translate(968 745) scale(-1 1) rotate(10)"/></g>

    <ellipse cx="600" cy="637" rx="272" ry="218" fill="#07a872"/>

    <!-- ojos normales -->
    <g id="eyes" class="anim"><g id="blink" class="anim">
      <circle cx="433" cy="627" r="29" fill="#fff"/><circle cx="772" cy="625" r="29" fill="#fff"/>
    </g></g>
    <!-- ojos felices ^ ^ -->
    <g id="happy" class="anim" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round">
      <path d="M404 640 Q433 598 462 640"/><path d="M743 638 Q772 596 801 638"/>
    </g>
    <!-- mejillas -->
    <ellipse cx="390" cy="690" rx="30" ry="16" fill="#ff8aa0" opacity=".55"/>
    <ellipse cx="812" cy="688" rx="30" ry="16" fill="#ff8aa0" opacity=".55"/>
    <!-- boca -->
    <path id="mouth" class="anim" d="M503 684 Q527 712 552 694 T602 694 T652 694 T702 684" fill="none" stroke="#2f3b3b" stroke-width="9" stroke-linecap="round"/>
    <path id="smile" class="anim" d="M548 676 Q602 738 656 676" fill="none" stroke="#2f3b3b" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Sobre -->
  <g id="env" class="anim">
    <rect x="512" y="742" width="176" height="118" rx="16" fill="#fff4e6"/>
    <path d="M512 758 Q512 742 528 742 H672 Q688 742 688 758 L600 818Z" fill="#ffe0c2"/>
    <path d="M512 850 L580 800 M688 850 L620 800" stroke="#ffd2a8" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <use href="#heart" x="600" y="806" fill="#ff5f5f" transform="translate(600 812) scale(1.1) translate(-600 -806)"/>
  </g>

  <!-- Manos -->
  <g id="hl" class="anim"><circle cx="506" cy="838" r="52" fill="#07a872"/><path d="M454 838a52 52 0 0 1 104 0" fill="none" stroke="#067a55" stroke-width="8" stroke-linecap="round"/></g>
  <g id="hr" class="anim"><circle cx="694" cy="838" r="52" fill="#07a872"/><path d="M642 838a52 52 0 0 1 104 0" fill="none" stroke="#067a55" stroke-width="8" stroke-linecap="round"/></g>

  <!-- Líneas de movimiento -->
  <g fill="none" stroke="#ffcc2e" stroke-width="12" stroke-linecap="round">
    <path class="anim mv" d="M700 640 l-50 70"/>
    <path class="anim mv b" d="M745 600 l-50 70"/>
    <path class="anim mv c" d="M655 680 l-40 56"/>
  </g>

  <!-- Corazones y estrellas -->
  <g>
    <use href="#heart" class="anim pop" x="800" y="470" fill="#ff5f5f"/>
    <use href="#heart" class="anim pop h2" x="900" y="400" fill="#ff8aa0"/>
    <use href="#heart" class="anim pop h3" x="720" y="410" fill="#ff5f5f"/>
    <use href="#star" class="anim pop s1" x="860" y="330" fill="#ffcc2e"/>
    <use href="#star" class="anim pop s2" x="960" y="470" fill="#ffcc2e"/>
  </g>
</svg>
